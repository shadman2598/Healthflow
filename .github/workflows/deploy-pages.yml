name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move API routes and dynamic [id] segments aside for static export
        run: |
          mkdir -p /tmp/healthflow-static-backup
          if [ -d apps/web/src/app/api ]; then
            mv apps/web/src/app/api /tmp/healthflow-static-backup/api
          fi
          # Client detail pages fail static prerender; omit from Pages export.
          if [ -d "apps/web/src/app/appointments/[id]" ]; then
            mv "apps/web/src/app/appointments/[id]" /tmp/healthflow-static-backup/appointments-id
          fi
          if [ -d "apps/web/src/app/patients/[id]" ]; then
            mv "apps/web/src/app/patients/[id]" /tmp/healthflow-static-backup/patients-id
          fi

      - name: Build static site
        working-directory: apps/web
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
