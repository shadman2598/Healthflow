version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: technovate-postgres
    environment:
      POSTGRES_DB: technovate_reminders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: technovate-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: technovate-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
